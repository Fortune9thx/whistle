name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        # pyright and nodeenv are pinned because genvm-linter only bounds
        # pyright from below. Python 3.12 no longer ships setuptools, which
        # nodeenv < 1.9 requires, so leaving either open makes pip backtrack
        # through every pyright release looking for a combination that needs
        # it -- and give up with `resolution-too-deep`. These are the
        # versions the toolchain resolves to when it resolves at all.
        run: |
          pip install --pre \
            genlayer-test==0.30.0rc2 \
            genvm-linter==0.11.1rc2 \
            pyright==1.1.414 \
            nodeenv==1.11.0 \
            pytest==9.1.1

      - name: Build deploy bundle
        # Fails outright if the bundle exceeds the 52,224-byte GenVM
        # deploy ceiling, rather than letting an undeployable artifact
        # through to a gas-costing deploy attempt.
        run: python contracts/build_bundle.py

      - name: Bundle is reproducible from source
        # The committed artifact must be exactly what this source builds,
        # so the deployed sha256 recorded in deploy/deployments.json can
        # be re-derived by anyone from the repo alone.
        run: git diff --exit-code -- contracts/build/Whistle.deploy.py

      - name: Lint bundled contract
        run: |
          PYTHONIOENCODING=utf-8 genvm-lint check contracts/build/Whistle.deploy.py

      - name: Typecheck bundled contract
        # genvm-lint typecheck cannot be gated on its exit code or its
        # summary line: it labels every diagnostic severity "?", always
        # prints "0 error(s), 0 warning(s)", and exits non-zero whenever
        # any diagnostic exists at all. Since pyright emits one for every
        # GenVM Annotated type (u256, Address) it believes is "not
        # callable" -- a false positive against the SDK's own
        # annotations -- that is always. So gate on the only thing that
        # carries signal: no diagnostic OTHER than that known class.
        run: |
          PYTHONIOENCODING=utf-8 genvm-lint typecheck \
            contracts/build/Whistle.deploy.py 2>&1 | tee typecheck.log || true
          if grep -E '^Whistle\.deploy\.py:' typecheck.log \
               | grep -vE 'Object of type "Annotated" is not callable'; then
            echo "::error::genvm-lint typecheck reported the diagnostics above"
            exit 1
          fi
          echo "No typecheck diagnostics beyond the known Annotated false positives."

      - name: Run direct-mode tests
        run: python -m pytest tests/direct -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `ci`, not `install`: the lockfile is authoritative, and a drift
        # between it and package.json should fail rather than be patched
        # up silently.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
